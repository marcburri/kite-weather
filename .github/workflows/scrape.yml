name: Scrape kite-weather stations

on:
  schedule:
    # Off the top of the hour on purpose - GitHub's scheduler is busiest at
    # minute 0 (when most repos' cron jobs fire) and can delay or drop runs
    # scheduled there. See:
    # https://docs.github.com/en/actions/using-workflows/events-that-trigger-workflows#schedule
    - cron: '7 * * * *'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: scrape-kite-weather
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - name: Install R dependencies
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::httr2
            any::rvest
            any::stringr
            any::lubridate
            any::readr
            any::dplyr

      - name: Run YvBeach scraper
        run: Rscript R/scrape_yvbeach.R

      - name: Run Silvaplana scraper
        run: Rscript R/scrape_silvaplana.R

      - name: Commit and push if changed
        run: |
          git config user.name "kite-weather-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/yvbeach.csv data/silvaplana.csv
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Add scrape $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
            git push
          fi
