name: Scrape YvBeach weather station

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: scrape-yvbeach
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - name: Install R dependencies
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::httr2
            any::rvest
            any::stringr
            any::lubridate
            any::readr
            any::dplyr
            any::glue
            any::blastula

      - name: Run scraper
        id: scrape
        run: Rscript R/scrape_yvbeach.R

      - name: Commit and push if changed
        run: |
          git config user.name "yvbeach-weather-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/yvbeach.csv
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Add scrape $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
            git push
          fi

      - name: Send wind alert if conditions are good
        if: steps.scrape.outputs.new_data == 'true'
        env:
          GMAIL_USERNAME: ${{ secrets.GMAIL_USERNAME }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          ALERT_EMAIL_TO: ${{ vars.ALERT_EMAIL_TO }}
        run: Rscript R/send_wind_alert.R
